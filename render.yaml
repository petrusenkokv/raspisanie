# Render (ONREZA) Blueprint — «Расписание тренировок»
#
# Как задеплоить:
#   1. Залейте проект в GitHub (репозиторий уже есть: petrusenkokv/raspisanie)
#   2. Откройте dashboard.render.com → New+ → Blueprint
#   3. Выберите этот репозиторий — Render сам создаст Web Service + PostgreSQL
#      и подставит DATABASE_URL.
#
# Дополнительно (по желанию):
#   - VAPID ключи для push-уведомлений — добавьте позже в
#     Dashboard → Service → Environment:
#       VAPID_PUBLIC_KEY=...
#       VAPID_PRIVATE_KEY=...

services:
  - type: web
    name: raspisanie
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Создать тренера, документы и слоты при первом старте (идемпотентно).
      - key: SEED_DATABASE_ON_STARTUP
        value: "true"
      # Секрет сессий — Render сгенерирует случайное значение.
      - key: SESSION_SECRET
        generateValue: true
      # Подключение к БД подставится автоматически из базы ниже.
      - key: DATABASE_URL
        fromDatabase:
          name: raspisanie-db
          property: connectionString

databases:
  - name: raspisanie-db
    plan: free
    region: frankfurt
    databaseName: raspisanie
    user: raspisanie