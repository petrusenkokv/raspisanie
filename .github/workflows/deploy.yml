name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/contabo_deploy
          chmod 600 ~/.ssh/contabo_deploy
          ssh-keyscan -H "$CONTABO_HOST" >> ~/.ssh/known_hosts

      - name: Trigger Coolify deploy
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf 'export COOLIFY_APP_UUID=%q\n' "$COOLIFY_APP_UUID"
            printf 'export COOLIFY_TOKEN=%q\n' "$COOLIFY_TOKEN"
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' 'curl -fsS -X POST "http://127.0.0.1:8000/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \'
            printf '%s\n' '  -H "Authorization: Bearer $COOLIFY_TOKEN"'
          } | ssh -i ~/.ssh/contabo_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$CONTABO_USER@$CONTABO_HOST" \
            'bash -se'
